services:
  death2bi:
    image: death2bi:latest
    build: .
    ports:
      - "127.0.0.1:8766:8765"
    environment:
      D2PBI_BASE_URL: http://127.0.0.1:8766
    volumes:
      - death2bi-state:/var/lib/death2bi
    restart: "on-failure:3"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  death2bi-state:
